name: Validate archive
on: [push, pull_request, workflow_dispatch]
jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: python tools/check_archive.py
      - run: python tools/check_all.py
  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-pictures texlive-fonts-recommended lmodern
      - run: python tools/build_documents.py
